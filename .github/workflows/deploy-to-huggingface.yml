name: Deploy to Hugging Face Space

# Runs automatically whenever this branch is pushed — mirrors how Render
# auto-redeploys the Node backend. Hugging Face Spaces don't watch external
# GitHub repos on their own, so this workflow does the actual push to the
# Space's own git repository on your behalf.
on:
  push:
    branches:
      - ignou_updates
  # Lets you manually trigger a redeploy from the GitHub Actions tab without
  # needing a new commit — handy the first time you're testing this.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: asvix/digilab
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the Space's own repo OUTSIDE this checkout (into the
          # runner's temp dir, a sibling of ./, not a subdirectory of it).
          # Cloning it as a subdirectory of ./ was the original design here
          # and caused a real bug: since rsync's source below is "./", a
          # clone living inside "./" gets swept up as part of its own
          # source and copied back into itself on every run — producing
          # hf_space/hf_space/hf_space/... nesting that got worse with each
          # deploy. Keeping the clone outside "./" entirely rules that out.
          HF_SPACE_DIR="${RUNNER_TEMP}/hf_space"
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" "${HF_SPACE_DIR}"

          # Mirror this repo's files into the Space folder, but leave these
          # alone (same exclusions we used doing this by hand):
          #   .git, .github, .claude — not part of the app
          #   node_modules, __pycache__, .venv, venv, dist — rebuilt by the
          #     Space's own Docker build, don't need to ship pre-built
          #   data — large corpus/BM25 files; not tracked in this repo and
          #     shouldn't be deleted from the Space if already present there
          #   crypt/backend/uploads — runtime user-uploaded files (PDFs,
          #     images). Hugging Face's git server rejects pushes containing
          #     binary files outright, so this must stay out of the mirror.
          #   crypt/src/assets — static image assets (team photos, hero
          #     backgrounds). Small and rarely changes; already correctly on
          #     the Space from the original manual setup, but re-committing
          #     it here trips the same binary-file rejection as uploads did.
          #     If these images ever change, push that update manually.
          #   README.md — the Space's own README carries HF's required
          #     metadata block (title/sdk/etc.); this repo's README is a
          #     different, generic one and would break the Space if it
          #     overwrote it
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='dist' \
            --exclude='data' \
            --exclude='crypt/backend/uploads' \
            --exclude='crypt/src/assets' \
            --exclude='README.md' \
            ./ "${HF_SPACE_DIR}/"

          cd "${HF_SPACE_DIR}"
          git add .
          git commit -m "Auto-deploy from GitHub ${{ github.sha }}" || echo "Nothing changed, skipping commit"
          git push
